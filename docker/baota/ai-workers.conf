[program:ai-quality-queue]
command=/usr/local/bin/php -d memory_limit=256M artisan geoflow:work-ai-quality front
directory=/var/www/html
user=www-data
autostart=false
autorestart=true
startsecs=3
stopwaitsecs=1200
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:ai-quality-backfill-queue]
command=/usr/local/bin/php -d memory_limit=192M artisan geoflow:work-ai-quality backfill
directory=/var/www/html
user=www-data
autostart=false
autorestart=true
startsecs=3
stopwaitsecs=1200
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

